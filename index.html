<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>과학 실험실 | 경기도화학교육연구회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;color:#0F172A;background:#fff;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1;max-width:960px;width:100%;margin:0 auto;padding:48px 24px}
  h1{font-size:30px;font-weight:900;margin:0 0 6px}
  h1 span{color:#2563EB}
  p.sub{color:#475569;margin:0 0 32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
  a.card{display:block;text-decoration:none;color:inherit;border:1px solid #E2E8F0;border-radius:16px;padding:20px 22px;transition:border-color .15s, box-shadow .15s}
  a.card:hover{border-color:#2563EB;box-shadow:0 4px 16px rgba(37,99,235,.08)}
  a.card h2{font-size:19px;margin:0 0 6px}
  a.card p{font-size:14px;color:#475569;margin:0}
  footer{text-align:center;padding:16px;border-top:1px solid #E2E8F0;color:#1D4ED8;font-weight:700}
</style>
</head>
<body>
<main>
  <h1><span>과학</span> 실험실</h1>
  <p class="sub">체험 행사용 실험 데이터 분석 프로그램 모음</p>
  <div class="grid">
    <a class="card" href="boyles-law/">
      <h2>보일의 법칙 실험</h2>
      <p>주사기와 압력 센서로 측정한 압력·부피 데이터를 붙여넣어 P–V, PV–V, P–1/V 그래프를 그리고 참가자 평균과 비교합니다.</p>
    </a>
  </div>
</main>
<footer>경기도화학교육연구회</footer>
</body>
</html>
